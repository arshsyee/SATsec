    <title>SATsec — website performance, SEO, accessibility & security audits</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the default palette.
      (function () {
        try {
          var t = localStorage.getItem('satsec_theme');
          if (['charcoal', 'violet', 'blue'].indexOf(t) !== -1) {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
